# Termux terminal properties
# Shared settings for both eink and dark themes

# Use a Nerd Font if installed, otherwise fallback
# Uncomment and set path if you have a font installed:
# terminal-font=JetBrainsMonoNerdFont-Regular.ttf

# Bell style: vibrate, sound, or ignore
bell-character=ignore

# Allow external apps to run termux commands
allow-external-apps=true

# Fullscreen
fullscreen=false

# Soft keyboard
hide-soft-keyboard-on-scroll=false

# Extra keys row (useful without hardware keyboard)
extra-keys=[['ESC','/','-','HOME','UP','END','PGUP'],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]
