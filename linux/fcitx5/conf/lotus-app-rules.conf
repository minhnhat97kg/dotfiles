# Lotus Per-App Configuration
# 0 = Off, 1 = Uinput (Smooth), 2 = Uinput (Slow), 3 = Uinput (Hardcore), 4 = Surrounding Text, 5 = Preedit, 6 = Emoji Picker
# Format is flat: <wayland-app-id>=<mode-number> (one per line).
# qutebrowser: use Preedit (5). QtWebEngine speaks Qt's native text-input-v3 on
# Wayland (see niri/config.kdl: QT_IM_MODULES="wayland;fcitx"), and Preedit is
# the mode that composes over that protocol. (Surrounding Text is dead -- niri
# doesn't relay the capability -- and uinput/Smooth is an injection hack we no
# longer need now that the native path works.)
org.qutebrowser.qutebrowser=5
