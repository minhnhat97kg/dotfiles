# fuzzel.ini — launcher theme, matched to the onedark/niri palette
# (dark base, blue #7fc8ff accent — same as the niri focus ring / swaylock).
# Symlinked to ~/.config/fuzzel/fuzzel.ini (the fuzzel/ dir is linked
# recursively by modules/home/niri.nix). Full reference: man 5 fuzzel.ini
# Colors are RRGGBBAA — the last two hex digits are alpha (ff = opaque).

[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
prompt="  "
placeholder=Search…
icon-theme=Yaru
icons-enabled=yes
fields=name,generic,comment,categories,keywords
terminal=kitty -e
layer=overlay
lines=12
width=42
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=26
tabs=4
fuzzy=yes
show-actions=no

[colors]
background=1a1d23f2
text=abb2bfff
prompt=7fc8ffff
placeholder=5c6370ff
input=e5c07bff
match=7fc8ffff
selection=282c34ff
selection-text=ffffffff
selection-match=98c379ff
counter=5c6370ff
border=7fc8ffff

[border]
width=2
radius=14

[dmenu]
# Used by the --dmenu scripts (clipboard, window switcher, smart-launcher).
exit-on-empty=yes

[key-bindings]
# vim-style list navigation, for the mouseless flow.
prev=Up Control+k Control+p
next=Down Control+j Control+n
