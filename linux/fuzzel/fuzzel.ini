# fuzzel.ini — launcher theme, styled after macOS Spotlight and matched to the
# shared desktop palette (translucent graphite panel, #0a84ff system-blue accent
# — same as the niri focus ring, waybar and swaync).
# Symlinked to ~/.config/fuzzel/fuzzel.ini (the fuzzel/ dir is linked
# recursively by modules/home/niri.nix). Full reference: man 5 fuzzel.ini
# Colors are RRGGBBAA — the last two hex digits are alpha (ff = opaque).

[main]
# SF Pro Text carries the UI text; the Nerd Font is the fallback that supplies
# the prompt glyph and any icon characters it has no coverage for.
font=SF Pro Text:size=13,JetBrainsMono Nerd Font:size=13
dpi-aware=no
prompt="  "
placeholder=Search…
icon-theme=Yaru
icons-enabled=yes
fields=name,generic,comment,categories,keywords
terminal=kitty -e
layer=overlay
lines=10
width=46
horizontal-pad=26
vertical-pad=20
inner-pad=14
line-height=30
tabs=4
fuzzy=yes
show-actions=no

# macOS dark-mode label ramp: f5f5f7 primary, 8e8e93 secondary, 636366 tertiary.
# Sits on real compositor blur (niri layer-rule, namespace "launcher") rather
# than flat alpha. DARK GLASS ON PURPOSE: real Liquid Glass lightens rather
# than darkens, but the user asked for a dark theme, so the panel is darkened
# instead. Keep the alpha well short of opaque — push it much past this and
# the blur behind it stops being visible at all, which is the whole reason the
# layer-rule exists.
# Selection is a light translucent fill, not accent blue — accent blue there
# was the pre-Tahoe look. The match highlight keeps the accent.
[colors]
background=0f0f11b3
text=f5f5f7ff
prompt=8e8e93ff
placeholder=8e8e93ff
input=f5f5f7ff
match=0a84ffff
selection=ffffff28
selection-text=f5f5f7ff
selection-match=0a84ffff
counter=636366ff
border=ffffff38

[border]
width=1
radius=20

[dmenu]
# Used by the --dmenu scripts (clipboard, window switcher, smart-launcher).
exit-on-empty=yes

[key-bindings]
# vim-style list navigation, for the mouseless flow.
prev=Up Control+k Control+p
next=Down Control+j Control+n
