# ==============================================================================
# TMUX — JetBrains 2026  ·  Nerd Font icons
# Applied via Nix (modules/home/terminal.nix).
# ==============================================================================

# ── Terminal & Colors ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -s set-clipboard on
set -g focus-events on

# ── Theme palette ─────────────────────────────────────────────────────────────
# Every style below references #{@c_*}. dark.conf/light.conf hold the palettes;
# tmux follows the terminal's light/dark (kitty reports the macOS appearance).
# On the niri desktop the Caelestia shell's palette (caelestia-theme-sync,
# modules/home/niri.nix) overrides both, so it's re-applied after each switch;
# on macOS caelestia-static.nix adds per-mode files (tmux-theme-light/dark.conf).
source-file ~/.config/tmux/dark.conf
source-file -q ~/.local/state/caelestia/tmux-theme.conf
set-hook -g client-light-theme 'source-file ~/.config/tmux/light.conf ; source-file -q ~/.local/state/caelestia/tmux-theme.conf ; source-file -q ~/.local/state/caelestia/tmux-theme-light.conf'
set-hook -g client-dark-theme  'source-file ~/.config/tmux/dark.conf ; source-file -q ~/.local/state/caelestia/tmux-theme.conf ; source-file -q ~/.local/state/caelestia/tmux-theme-dark.conf'

# ── General Settings ──────────────────────────────────────────────────────────
set -g mouse on
set -sg escape-time 0
set -g history-limit 10000
# Status-bar refresh; 30s keeps the %H:%M clock at most half a minute stale.
set -g status-interval 30
# Size a window to the client actually viewing it instead of the smallest
# attached client, so a second smaller client doesn't force constant resizes.
set -g aggressive-resize on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Vi Mode & Copying ─────────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ── Navigation & Splits ───────────────────────────────────────────────────────
bind c command-prompt -p "Name:" -I "window" "new-window -n '%%' -c '#{pane_current_path}'"
bind | command-prompt -p "Name:" -I "split" "split-window -h -c '#{pane_current_path}' ; rename-window '%%'"
bind \\ command-prompt -p "Name:" -I "split" "split-window -h -c '#{pane_current_path}' ; rename-window '%%'"
bind - command-prompt -p "Name:" -I "split" "split-window -v -c '#{pane_current_path}' ; rename-window '%%'"
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 󰑓 Config reloaded!"

# Smart pane navigation (vim/fzf-aware)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "($is_vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "($is_vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Pane resizing
bind -n M-h if-shell "$is_vim" "send-keys M-h" "resize-pane -L 5"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "resize-pane -D 5"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "resize-pane -U 5"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "resize-pane -R 5"

# Window navigation
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# ── Pane Borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#{@c_border},bg=default"
set -g pane-active-border-style "fg=#{@c_accent},bg=default"

# No pane titles: borders stay a plain line.
set -g pane-border-status off

# ── Window / Tab Styles — kitty tab-bar replacement, JetBrains colors ────────
# Kitty's own tab bar never renders here (single OS window, tmux does the
# multiplexing), so this status bar takes over that role visually and moved
# to the top like kitty's tab_bar_edge.
set -g window-status-activity-style "none"
set -g window-status-bell-style     "none"

set -g status-style "bg=default,fg=#{@c_dim}"

# Inactive tab:  dim file icon · number · name
set -g window-status-style  "bg=default,fg=#{@c_dim}"
set -g window-status-format \
  "  #{?window_bell_flag,#[fg=#{@c_yellow}],#[fg=#{@c_border}]} #[fg=#{@c_dim}]#I  #W  "

# Active tab: surface-coloured capsule (rounded caps) + accent icon
set -g window-status-current-style "bg=#{@c_surface},fg=#{@c_text},bold"
set -g window-status-current-format \
  "#[bg=default,fg=#{@c_surface}]#[bg=#{@c_surface},fg=#{@c_accent}] #[fg=#{@c_text}]#I  #W#[bg=default,fg=#{@c_surface}]"

# ── Status Bar ────────────────────────────────────────────────────────────────
set -g status-position    top
set -g status-left-length 40
set -g status-right-length 120

# Left: accent capsule (rounded caps) — neovim icon + session name
set -g status-left \
  "#[bg=default,fg=#{@c_accent}]#[bg=#{@c_accent},fg=#{@c_on_accent},bold] #S#[bg=default,fg=#{@c_accent}] "

# ── Messages & Copy Mode ──────────────────────────────────────────────────────
set -g message-style         "bg=#{@c_surface},fg=#{@c_accent},bold"
set -g message-command-style "bg=#{@c_surface},fg=#{@c_text}"
set -g mode-style            "bg=#{@c_sel},fg=#{@c_text}"

# ── Scratch Terminal Popup  (prefix + g) ─────────────────────────────────────
bind g if-shell -F '#{==:#{session_name},scratch}' \
    'detach-client' \
    'display-popup -E -x 0 -y C -w 40% -h 90% -T " \uf489 Terminal " "tmux attach -t scratch || tmux new -s scratch"'

# ── Popup Styling ─────────────────────────────────────────────────────────────
set -g popup-style        "bg=default,fg=#{@c_text}"
set -g popup-border-style "fg=#{@c_accent}"
set -g popup-border-lines "rounded"

# ── Layouts  (prefix + L menu, prefix + Space cycle) ─────────────────────────
# The list and the cycle order live in shared/tmux/scripts/cycle-layout.sh;
# the current layout's name shows in the status bar (@layout_name).
bind L display-menu -T "#[align=centre]\uf0c8 Select Layout" \
  "\uf0c7 Main top" t "run-shell '~/.config/tmux/scripts/cycle-layout.sh #{window_id} stack'" \
  "\uf0c7 Main bottom" b "run-shell '~/.config/tmux/scripts/cycle-layout.sh #{window_id} stack-bottom'" \
  "\uf0db Main left" h "run-shell '~/.config/tmux/scripts/cycle-layout.sh #{window_id} main-left'" \
  "\uf0db Main right" r "run-shell '~/.config/tmux/scripts/cycle-layout.sh #{window_id} main-right'" \
  "\uf0c9 Rows" l "run-shell '~/.config/tmux/scripts/cycle-layout.sh #{window_id} list'" \
  "\uf0db Columns" c "run-shell '~/.config/tmux/scripts/cycle-layout.sh #{window_id} columns'" \
  "\uf00a Grid" g "run-shell '~/.config/tmux/scripts/cycle-layout.sh #{window_id} grid'"
bind Space run-shell "~/.config/tmux/scripts/cycle-layout.sh #{window_id}"
set -g allow-passthrough all

# ── Session Persistence (resurrect + continuum) ───────────────────────────────
# tmux-resurrect: manually save/restore sessions
# tmux-continuum: auto-save every 15 min + auto-restore after reboot
#
# First-time setup — run once in shell:
#   git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm
#   git clone https://github.com/tmux-plugins/tmux-resurrect ~/.config/tmux/plugins/tmux-resurrect
#   git clone https://github.com/tmux-plugins/tmux-continuum ~/.config/tmux/plugins/tmux-continuum
#   tmux source ~/.config/tmux/tmux.conf   (then press prefix + I if using TPM)

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# resurrect — save: prefix + Ctrl-s  |  restore: prefix + Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'off'       # off: full pane capture on every save stalls the server
set -g @resurrect-strategy-nvim 'session'            # restore Neovim sessions
# Restore additional processes not in the default list
# ~opencode matches any command containing "opencode" (handles full paths)
set -g @resurrect-processes 'opencode ~opencode ssh'

# continuum — auto-save interval (minutes) + restore on tmux server start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM. This runs each plugin synchronously, and tmux-continuum
# rewrites status-right while doing so: it appends "#(continuum_save.sh)" to
# drive its auto-save timer off the status bar. status-right is therefore
# defined *below* this line, after the plugins have had their say.
run '~/.config/tmux/plugins/tpm/tpm'

# ── Status Bar — right side ───────────────────────────────────────────────────
# layout · cwd · date · clock.
#
# Everything here must stay cheap: tmux re-runs every #() command substitution
# whenever it redraws the status line, which happens on essentially every
# keystroke. Each #() is a fork+exec (and continuum's scripts forked tmux
# itself), which is what made the server stall. So:
#   · no #() at all;
#   · the basename uses the built-in #{b:pane_current_path}, no fork;
#   · no #{continuum_status}, whose script called tmux twice per redraw.
set -g status-right \
 "#[fg=#{@c_gray3}]│ \
#{?@layout_name,#[fg=#{@c_dim}]󰕰 #[fg=#{@c_muted}]#{@layout_name} #[fg=#{@c_gray3}]│ ,}\
#[fg=#{@c_dim}] #[fg=#{@c_muted}]#{b:pane_current_path} \
#[fg=#{@c_gray3}]│ \
#[fg=#{@c_dim}] #[fg=#{@c_muted}]%d %b \
#[fg=#{@c_gray3}]│ \
#[fg=#{@c_dim}] #[fg=#{@c_accent},bold]%H:%M "

# ── Session auto-save timer ───────────────────────────────────────────────────
# Drives tmux-resurrect from a real detached timer instead of a status-bar #()
# (see autosave.sh). tmux-continuum stays loaded only for its auto-restore on
# server start; with the line above re-asserting status-right, its save timer
# never fires. autosave.sh self-guards against duplicate instances on reload.
run-shell -b '~/.config/tmux/scripts/autosave.sh 15'
