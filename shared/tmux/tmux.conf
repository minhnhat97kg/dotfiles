# ==============================================================================
# TMUX — JetBrains 2026  ·  Orange Accent  ·  Nerd Font icons
# Theme: dark, fixed. Colours live in dark.conf as @c_* options — to switch
# palette, edit this file's source-file line (or dark.conf's values) and
# apply via Nix (see modules/home/terminal.nix). light.conf is kept as an
# alternative palette to swap in the same way.
# ==============================================================================

# ── Terminal & Colors ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -s set-clipboard on
set -g focus-events on
set -g set-clipboard on

# ── Theme palette ──────────────────────────────────────────────────────────────
# Loads @c_* colour options; every style below references #{@c_*}.
source-file ~/.config/tmux/dark.conf

# ── General Settings ──────────────────────────────────────────────────────────
set -g mouse on
set -sg escape-time 0
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ── Vi Mode & Copying ─────────────────────────────────────────────────────────
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ── Navigation & Splits ───────────────────────────────────────────────────────
bind c command-prompt -p "Name:" -I "window" "new-window -n '%%' -c '#{pane_current_path}'"
bind | command-prompt -p "Name:" -I "split" "split-window -h -c '#{pane_current_path}' ; rename-window '%%'"
bind \\ command-prompt -p "Name:" -I "split" "split-window -h -c '#{pane_current_path}' ; rename-window '%%'"
bind - command-prompt -p "Name:" -I "split" "split-window -v -c '#{pane_current_path}' ; rename-window '%%'"
bind r source-file ~/.config/tmux/tmux.conf \; display-message " 󰑓 Config reloaded!"

# Smart pane navigation (vim/fzf-aware)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h run "($is_vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "($is_vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "($is_vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "($is_vim && tmux send-keys C-l) || tmux select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Pane resizing
bind -n M-h if-shell "$is_vim" "send-keys M-h" "resize-pane -L 5"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "resize-pane -D 5"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "resize-pane -U 5"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "resize-pane -R 5"

# Window navigation
bind -n M-, previous-window
bind -n M-. next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# ── Pane Borders ──────────────────────────────────────────────────────────────
set -g pane-border-style        "fg=#{@c_border},bg=default"
set -g pane-active-border-style "fg=#{@c_accent},bg=default"

# ── Pane Border Title (hidden for single-pane & scratch) ─────────────────────
set-hook -g window-layout-changed \
  'if-shell -F "#{&&:#{>:#{window_panes},1},#{!=:#{session_name},scratch}}" \
    "set -g pane-border-status top" "set -g pane-border-status off"'
set-hook -g client-session-changed \
  'if-shell -F "#{==:#{session_name},scratch}" "set -g pane-border-status off"'

set -g pane-border-format \
  "#{?pane_active,#[fg=#{@c_accent}] \u2588,#[fg=#{@c_border}] \u2503} #{pane_index} #[fg=#{@c_muted}]#(basename #{pane_current_path}) "


# ── Window / Tab Styles — kitty tab-bar replacement, JetBrains colors ────────
# Kitty's own tab bar never renders here (single OS window, tmux does the
# multiplexing), so this status bar takes over that role visually and moved
# to the top like kitty's tab_bar_edge. Colors stay on the existing @c_*
# palette rather than kitty's own Catppuccin theme.
set -g window-status-activity-style "none"
set -g window-status-bell-style     "none"

set -g status-style "bg=#{@c_bg},fg=#{@c_dim}"

# Inactive tab:  dim file icon · number · name
set -g window-status-style  "bg=#{@c_bg},fg=#{@c_dim}"
set -g window-status-format \
  "  #{?window_bell_flag,#[fg=#{@c_yellow}],#[fg=#{@c_border}]} #[fg=#{@c_dim}]#I  #W  "

# Active tab: Gray2 surface + Orange accent icon (JetBrains tab accent line)
set -g window-status-current-style "bg=#{@c_surface},fg=#{@c_text},bold"
set -g window-status-current-format \
  "#[bg=#{@c_surface},fg=#{@c_accent}] #[fg=#{@c_text}]#I  #W #[bg=#{@c_bg},fg=#{@c_surface}]"

# ── Status Bar ────────────────────────────────────────────────────────────────
set -g status-position    top
set -g status-left-length 40
set -g status-right-length 80

# Left: Orange pill — neovim icon + session name + separator
set -g status-left \
  "#[bg=#{@c_accent},fg=#{@c_on_accent},bold]  #S #[bg=#{@c_bg},fg=#{@c_accent}] "

# ── Messages & Copy Mode ──────────────────────────────────────────────────────
set -g message-style         "bg=#{@c_surface},fg=#{@c_accent},bold"
set -g message-command-style "bg=#{@c_surface},fg=#{@c_text}"
set -g mode-style            "bg=#{@c_sel},fg=#{@c_text}"

# ── Scratch Terminal Popup  (prefix + g) ─────────────────────────────────────
bind g if-shell -F '#{==:#{session_name},scratch}' \
    'detach-client' \
    'display-popup -E -x 0 -y C -w 40% -h 90% -T " \uf489 Terminal " "tmux attach -t scratch || tmux new -s scratch"'

# ── Popup Styling ─────────────────────────────────────────────────────────────
set -g popup-style        "bg=#{@c_bg},fg=#{@c_text}"
set -g popup-border-style "fg=#{@c_accent}"
set -g popup-border-lines "rounded"

# ── Layout Picker Menu  (prefix + L) ─────────────────────────────────────────
bind L display-menu -T "#[align=centre]\uf0c8 Select Layout" \
  "\uf0c7 Stack (main-horizontal)"   s \
    "set-hook -g pane-focus-in 'resize-pane -y 80%'; \
     set-window-option @layout_mode 'stack'; \
     select-layout main-horizontal; \
     set-window-option main-pane-height 80%; \
     display-message '\uf0c7 Layout: Stack'" \
  "\uf0c9 List (even-vertical)"      l \
    "set-hook -u -g pane-focus-in; \
     set-window-option @layout_mode 'list'; \
     select-layout even-vertical; \
     display-message '\uf0c9 Layout: List'" \
  "\uf00a Grid (tiled)"              g \
    "set-hook -u -g pane-focus-in; \
     set-window-option @layout_mode 'grid'; \
     select-layout tiled; \
     display-message '\uf00a Layout: Grid'" \
  "\uf0db Columns (even-horizontal)" c \
    "set-hook -u -g pane-focus-in; \
     set-window-option @layout_mode 'columns'; \
     select-layout even-horizontal; \
     display-message '\uf0db Layout: Columns'"

# ── Layout Cycler  (prefix + Space) ──────────────────────────────────────────
# stack → list → grid → columns → stack → … (see tmux/scripts/cycle-layout.sh,
# the single source of truth for this cycle)
bind Space run-shell "~/.config/tmux/scripts/cycle-layout.sh"
set -g set-clipboard on
set -g allow-passthrough all

# ── Session Persistence (resurrect + continuum) ───────────────────────────────
# tmux-resurrect: manually save/restore sessions
# tmux-continuum: auto-save every 15 min + auto-restore after reboot
#
# First-time setup — run once in shell:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   git clone https://github.com/tmux-plugins/tmux-resurrect ~/.tmux/plugins/tmux-resurrect
#   git clone https://github.com/tmux-plugins/tmux-continuum ~/.tmux/plugins/tmux-continuum
#   tmux source ~/.tmux.conf   (then press prefix + I if using TPM)

# TPM plugin manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# resurrect — save: prefix + Ctrl-s  |  restore: prefix + Ctrl-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'        # restore pane content
set -g @resurrect-strategy-nvim 'session'            # restore Neovim sessions
# Restore additional processes not in the default list
# ~opencode matches any command containing "opencode" (handles full paths)
set -g @resurrect-processes 'opencode ~opencode ssh'

# continuum — auto-save interval (minutes) + restore on tmux server start
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Show continuum status in status-right (optional indicator)
# Append to right side: auto-save state
set -g status-right \
  "#[fg=#{@c_dim}] #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null || echo '—') \
#[fg=#{@c_gray3}]│ \
#[fg=#{@c_dim}] #[fg=#{@c_muted}]#(basename #{pane_current_path}) \
#[fg=#{@c_gray3}]│ \
#[fg=#{@c_dim}] #[fg=#{@c_muted}]%d %b \
#[fg=#{@c_gray3}]│ \
#[fg=#{@c_dim}] #[fg=#{@c_accent},bold]%H:%M \
#[fg=#{@c_gray3}]│ \
#[fg=#{@c_green}] #{continuum_status} "

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
