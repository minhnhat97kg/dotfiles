# Dark palette (jb.nvim): values read out of a running Neovim, not the JetBrains
# spec. Comment after each name is the Neovim group it came from.
set -g @c_bg        "#191A1C"  ;# Normal bg
set -g @c_surface   "#2B2D30"  ;# ToolWindowFloatNormal
set -g @c_gray3     "#323438"  ;# WinSeparator
set -g @c_border    "#43454A"  ;# FloatBorder
set -g @c_dim       "#7A7E85"  ;# Comment
set -g @c_muted     "#95979C"  ;# StatusLine fg
set -g @c_text      "#BCBEC4"  ;# Normal fg
set -g @c_accent    "#56A8F5"  ;# Function -- JetBrains' focus blue
set -g @c_on_accent "#191A1C"  ;# text on accent = editor bg
set -g @c_sel       "#214283"  ;# Visual -- copy-mode matches Neovim's selection
set -g @c_yellow    "#F2C55C"  ;# DiagnosticWarn
set -g @c_green     "#6AAB73"  ;# String
set -g @c_red       "#FA6675"  ;# DiagnosticError
